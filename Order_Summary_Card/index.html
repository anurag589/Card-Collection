<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="images.jpg" alt="card_image" />
        <h2>Order Summary</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit
          accusantium numquam quae odit quis exercitationem, velit odio mollitia
          officia dolore?
        </p>
        <div class="plan_Container">
            <img src="music.png" alt="music_image" class="music">
            <div class="plan">
                <span>Annual Plan</span>
                <span>$99.9/year</span>
            </div>
            <a href="#">Change</a>
        </div>
        <button>
            Proceed To Payment
        </button>
        <a href="#" class="calOrder">Cancel Order</a>
      </div>
    </div>
  </body>
</html>
