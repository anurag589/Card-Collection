<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="content">
          <h1>Get insight that help your business grow</h1>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor
            officia est fugiat nemo quae. Est eligendi pariatur modi ducimus sed
            tenetur obcaecati quos! Aliquam laboriosam aperiam perferendis a,
            iusto ducimus!
          </p>
          <div class="button_content">
            <div class="comment">
                <h1>10K+</h1>
                <p>Comments</p>
            </div>
            <div class="paid_user">
                <h1>214</h1>
                <p>Paid User</p>
            </div>
            <div class="view">
                <h1>100K+</h1>
                <p>View</p>
            </div>
          </div>
        </div>
        <div class="logo_image">
          <img src="images.jpg" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
